  <!-- Install prompt: ο Chrome δεν δίνει κουμπί στη μπάρα στο Android, οπότε το δείχνουμε εμείς. -->
  <script>
    (function () {
      var KEY = 'mr-install-dismissed';
      var DAY = 86400000;
      var deferred = null;
      var shown = false;

      function standalone() {
        return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
               window.navigator.standalone === true;
      }
      function dismissed() {
        try {
          var ts = Number(localStorage.getItem(KEY) || 0);
          return ts > 0 && (Date.now() - ts) < 7 * DAY;
        } catch (e) { return false; }
      }
      function remember() {
        try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {}
      }
      function isIos() {
        var ua = navigator.userAgent || '';
        if (/iPad|iPhone|iPod/.test(ua)) return true;
        return /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
      }
      function ready(fn) {
        if (document.body) fn();
        else document.addEventListener('DOMContentLoaded', fn);
      }

      function build(opts) {
        if (shown || standalone()) return;
        shown = true;
        ready(function () {
          if (document.getElementById('mr-install')) return;
          var card = document.createElement('div');
          card.id = 'mr-install';
          card.setAttribute('role', 'dialog');
          card.setAttribute('aria-label', 'Εγκατάσταση εφαρμογής');
          card.style.cssText = [
            'position:fixed', 'left:12px', 'right:12px',
            'bottom:calc(12px + env(safe-area-inset-bottom))',
            'max-width:460px', 'margin:0 auto', 'z-index:9999',
            'display:flex', 'align-items:center', 'gap:12px',
            'padding:12px 14px', 'border-radius:16px',
            'background:#0f172a', 'border:1px solid #1e293b',
            'box-shadow:0 12px 32px rgba(0,0,0,.55)',
            'font-family:Inter,system-ui,-apple-system,sans-serif',
            'color:#f8fafc'
          ].join(';');

          var icon = document.createElement('div');
          icon.style.cssText = 'flex:0 0 auto;width:38px;height:38px;border-radius:10px;background:#020617;display:flex;align-items:center;justify-content:center;font-size:20px';
          icon.textContent = '🏍️';

          var text = document.createElement('div');
          text.style.cssText = 'flex:1 1 auto;min-width:0;line-height:1.25';
          var title = document.createElement('div');
          title.style.cssText = 'font-size:14px;font-weight:700';
          title.textContent = opts.title;
          var sub = document.createElement('div');
          sub.style.cssText = 'font-size:11.5px;color:#94a3b8;margin-top:2px';
          sub.textContent = opts.subtitle;
          text.appendChild(title);
          text.appendChild(sub);

          card.appendChild(icon);
          card.appendChild(text);

          if (opts.action) {
            var go = document.createElement('button');
            go.id = 'mr-install-go';
            go.type = 'button';
            go.textContent = opts.action;
            go.style.cssText = 'flex:0 0 auto;padding:9px 14px;border:0;border-radius:10px;background:#f59e0b;color:#020617;font:700 13px/1 Inter,system-ui,sans-serif;cursor:pointer';
            go.addEventListener('click', function () {
              if (!deferred) return;
              deferred.prompt();
              deferred.userChoice.then(function (choice) {
                deferred = null;
                close(choice && choice.outcome === 'accepted' ? 30 : 3);
              }).catch(function () { close(3); });
            });
            card.appendChild(go);
          }

          var x = document.createElement('button');
          x.type = 'button';
          x.setAttribute('aria-label', 'Κλείσιμο');
          x.textContent = '✕';
          x.style.cssText = 'flex:0 0 auto;width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:#64748b;font-size:14px;cursor:pointer';
          x.addEventListener('click', function () { close(7); });
          card.appendChild(x);

          document.body.appendChild(card);
        });
      }

      function close(days) {
        var el = document.getElementById('mr-install');
        if (el) el.remove();
        shown = false;
        if (days >= 7) remember();
        else {
          try { localStorage.setItem(KEY, String(Date.now() - (7 - days) * DAY)); } catch (e) {}
        }
      }

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
        if (dismissed()) return;
        build({ title: 'Εγκατάσταση MotoRoutes', subtitle: 'Γρήγορη πρόσβαση από την αρχική οθόνη', action: 'Εγκατάσταση' });
      });

      window.addEventListener('appinstalled', function () {
        deferred = null;
        var el = document.getElementById('mr-install');
        if (el) el.remove();
        try { localStorage.removeItem('mr-install-dismissed'); } catch (e) {}
      });

      /* iOS: δεν υπάρχει beforeinstallprompt — δείχνουμε οδηγίες μία φορά. */
      if (isIos() && !standalone() && !dismissed()) {
        ready(function () {
          build({ title: 'Προσθήκη στην αρχική οθόνη', subtitle: 'Κοινοποίηση ⬆️ → «Προσθήκη στην αρχική οθόνη»', action: null });
        });
      }
    })();
  </script>
